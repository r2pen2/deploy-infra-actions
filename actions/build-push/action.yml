name: Build and push GHCR images
description: Build catalog apps and push to ghcr.io
inputs:
  catalog:
    description: Path to deploy/apps.json
    required: false
    default: deploy/apps.json
  apps:
    description: Comma-separated app names to build
    required: true
  owner:
    description: GHCR owner / org
    required: false
    default: ${{ github.repository_owner }}
  sha:
    description: Image SHA tag
    required: false
    default: ${{ github.sha }}
  tag-prefix:
    description: Optional tag prefix (e.g. pr-12 for QA)
    required: false
    default: ""
  working-directory:
    description: Caller repo root
    required: false
    default: "."
  plain-docker:
    description: Use docker build instead of buildx (self-hosted)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build and push
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPS: ${{ inputs.apps }}
        OWNER: ${{ inputs.owner }}
        SHA: ${{ inputs.sha }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        CATALOG: ${{ inputs.catalog }}
        ACTION_PATH: ${{ github.action_path }}
        GLADOS_DOCKER_BUILD: ${{ inputs.plain-docker == 'true' && '1' || '' }}
      run: |
        set -euo pipefail
        SCRIPT="${ACTION_PATH}/../../scripts/build-push.mjs"
        extra=()
        if [[ -n "${TAG_PREFIX}" ]]; then
          extra+=(--tag-prefix "${TAG_PREFIX}")
        fi
        node "${SCRIPT}" \
          --catalog "${CATALOG}" \
          --apps "${APPS}" \
          --owner "${OWNER}" \
          --sha "${SHA}" \
          "${extra[@]}"
