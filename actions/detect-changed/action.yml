name: Detect changed catalog apps
description: Output apps_csv / has_apps from git diff + deploy/apps.json
inputs:
  catalog:
    required: false
    default: deploy/apps.json
  base:
    description: Base git SHA
    required: true
  head:
    description: Head git SHA
    required: false
    default: ${{ github.sha }}
  scope:
    description: qa or publish
    required: false
    default: publish
  shared:
    description: Comma-separated shared path prefixes
    required: false
    default: ""
  working-directory:
    required: false
    default: "."
outputs:
  apps:
    description: JSON array of app names
    value: ${{ steps.detect.outputs.apps }}
  apps_csv:
    description: Comma-separated app names
    value: ${{ steps.detect.outputs.apps_csv }}
  has_apps:
    description: true if any apps changed
    value: ${{ steps.detect.outputs.has_apps }}
  build_csv:
    description: Apps that need image builds
    value: ${{ steps.detect.outputs.build_csv }}
  has_build:
    value: ${{ steps.detect.outputs.has_build }}

runs:
  using: composite
  steps:
    - name: Detect
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CATALOG: ${{ inputs.catalog }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        SCOPE: ${{ inputs.scope }}
        SHARED: ${{ inputs.shared }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        SCRIPT="${ACTION_PATH}/../../scripts/detect-changed-apps.mjs"
        LIB="$(cd "${ACTION_PATH}/../../scripts/lib" && pwd)/catalog.mjs"
        extra=()
        if [[ -n "${SHARED}" ]]; then
          extra+=(--shared "${SHARED}")
        fi
        json="$(node "${SCRIPT}" --catalog "${CATALOG}" --base "${BASE}" --head "${HEAD}" --scope "${SCOPE}" --json "${extra[@]}")"
        apps="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(j.apps||[]))' "${json}")"
        csv="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write((j.apps||[]).join(","))' "${json}")"
        build_csv="$(
          CATALOG="${CATALOG}" CSV="${csv}" LIB="${LIB}" node --input-type=module -e "
            import { pathToFileURL } from 'node:url';
            import { loadCatalog } from pathToFileURL(process.env.LIB).href;
            const c = loadCatalog(process.env.CATALOG);
            const wanted = new Set((process.env.CSV || '').split(',').filter(Boolean));
            process.stdout.write(c.buildApps.filter((a) => wanted.has(a.app)).map((a) => a.app).join(','));
          "
        )"
        {
          echo "apps=${apps}"
          echo "apps_csv=${csv}"
          echo "build_csv=${build_csv}"
          if [[ -n "${csv}" ]]; then echo "has_apps=true"; else echo "has_apps=false"; fi
          if [[ -n "${build_csv}" ]]; then echo "has_build=true"; else echo "has_build=false"; fi
        } >> "$GITHUB_OUTPUT"
        echo "detect=${json}"
