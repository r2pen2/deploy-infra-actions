name: Deploy prod compose on glados
description: Copy compose templates into /opt/services/apps and docker compose up -d
inputs:
  catalog:
    description: Path to deploy/apps.json in the caller repo
    required: false
    default: deploy/apps.json
  apps:
    description: Comma-separated app names to deploy
    required: true
  sha:
    description: Git SHA (for image tag env vars)
    required: false
    default: ""
  order:
    description: Optional deploy order (comma-separated)
    required: false
    default: ""
  working-directory:
    description: Caller repo root
    required: false
    default: "."
  ghcr-user:
    description: GHCR username for pull (optional)
    required: false
    default: ${{ github.repository_owner }}
  ghcr-token:
    description: Token for GHCR pull (optional; private packages)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Login to GHCR (optional)
      if: ${{ inputs.ghcr-token != '' }}
      shell: bash
      env:
        GHCR_USER: ${{ inputs.ghcr-user }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
      run: |
        set -euo pipefail
        echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin

    - name: Deploy compose stacks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPS: ${{ inputs.apps }}
        SHA: ${{ inputs.sha }}
        CATALOG: ${{ inputs.catalog }}
        ORDER: ${{ inputs.order }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        SCRIPT="${ACTION_PATH}/../../scripts/deploy-prod.mjs"
        extra=()
        if [[ -n "${ORDER}" ]]; then
          extra+=(--order "${ORDER}")
        fi
        node "${SCRIPT}" \
          --catalog "${CATALOG}" \
          --apps "${APPS}" \
          --sha "${SHA}" \
          "${extra[@]}"
