# Reusable: PR QA preview (build pr-N tags, deploy on glados, sticky comment).
name: QA preview (reusable)

on:
  workflow_call:
    inputs:
      catalog:
        type: string
        required: false
        default: deploy/apps.json
      firestore-script:
        type: string
        required: false
        default: ""
      plain-docker:
        type: boolean
        required: false
        default: false
    secrets:
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  detect:
    name: detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      apps_csv: ${{ steps.detect.outputs.apps_csv }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        uses: r2pen2/deploy-infra-actions/actions/detect-changed@main
        with:
          catalog: ${{ inputs.catalog }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          scope: qa

  build:
    name: build pr images
    needs: detect
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.plain-docker }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: r2pen2/deploy-infra-actions/actions/build-push@main
        with:
          catalog: ${{ inputs.catalog }}
          apps: ${{ needs.detect.outputs.apps_csv }}
          owner: ${{ github.repository_owner }}
          sha: ${{ github.sha }}
          tag-prefix: pr-${{ github.event.pull_request.number }}
          plain-docker: ${{ inputs.plain-docker && 'true' || 'false' }}

  deploy:
    name: deploy on glados
    needs: [detect, build]
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: [self-hosted, glados]
    outputs:
      deployments: ${{ steps.deploy.outputs.deployments }}
    steps:
      - uses: actions/checkout@v4

      - id: deploy
        uses: r2pen2/deploy-infra-actions/actions/qa-deploy@main
        with:
          catalog: ${{ inputs.catalog }}
          apps: ${{ needs.detect.outputs.apps_csv }}
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.sha }}
          owner: ${{ github.repository_owner }}
          firestore-script: ${{ inputs.firestore-script }}

  comment:
    name: PR comment
    needs: [detect, deploy]
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HAS_APPS: ${{ needs.detect.outputs.has_apps }}
          DEPLOYMENTS: ${{ needs.deploy.outputs.deployments }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/r2pen2/deploy-infra-actions.git .deploy-infra
          if [[ "${HAS_APPS}" != "true" ]]; then
            node .deploy-infra/scripts/qa/comment-pr.mjs --pr "$PR" --empty
            exit 0
          fi
          if [[ "${DEPLOY_RESULT}" != "success" || -z "${DEPLOYMENTS}" ]]; then
            echo "Deploy did not succeed; skipping URL comment"
            exit 0
          fi
          node .deploy-infra/scripts/qa/comment-pr.mjs --pr "$PR" --deployments "$DEPLOYMENTS"
