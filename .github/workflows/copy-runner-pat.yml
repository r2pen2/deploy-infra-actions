name: copy-runner-pat
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy RUNNER_ADMIN_PAT to r2pen2/devops
        env:
          PAT: ${{ secrets.RUNNER_ADMIN_PAT }}
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_PAT }}
        run: |
          set -euo pipefail
          [ -n "$PAT" ] || { echo "::error::RUNNER_ADMIN_PAT missing"; exit 1; }
          printf '%s' "$PAT" | gh secret set RUNNER_ADMIN_PAT --repo r2pen2/devops
